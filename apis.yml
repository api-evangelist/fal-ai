    type: Documentation
  - url: https://github.com/fal-ai/real-time-demo-app
    type: CodeExamples
  - url: asyncapi/fal-ai-asyncapi.yml
    type: AsyncAPI
  description: >-
    WebSocket-based realtime inference for ultra-low latency interactive generative experiences such as
    LCM/SDXL sketch-to-image, live-portrait, and realtime upscaling. Bi-directional binary/JSON messaging
    keeps a persistent connection open so each frame, prompt, or pose adjustment is processed in milliseconds.
    Powers fal.realtime client utilities used in canvas apps, drawing tools, AR experiences, and live
    video pipelines.
